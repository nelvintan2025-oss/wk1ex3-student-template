
<!doctype html>
<html>
  <head>
    <title>Demo: Get Started Debugging JavaScript with Chrome DevTools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <h1>Demo: Get Started Debugging JavaScript with Chrome DevTools</h1>
    <label for="num1">Number 1</label>
    <input placeholder="Number 1" id="num1">
    <label for="num2">Number 2</label>
    <input placeholder="Number 2" id="num2">
    <button onclick="addNumbers()">Add Number 1 and Number 2</button>

    <script>
      function addNumbers() {
        const input1 = document.getElementById('num1').value.trim();
        const input2 = document.getElementById('num2').value.trim();

        const num1 = Number(input1);
        const num2 = Number(input2);

        // Check if either input is empty or not a valid number
        if (input1 === '' || input2 === '' || Number.isNaN(num1) || Number.isNaN(num2)) {
          console.log('Please enter numbers only');
        } else {
          console.log(num1 + num2);
        }
      }
    </script>
  </body>
</html>
